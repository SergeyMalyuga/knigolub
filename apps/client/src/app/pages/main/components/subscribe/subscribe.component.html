<section class="subscribe" id="{{Section.SUBSCRIBE}}">
  <div class="subscribe__content container">
    <div class="subscribe__info">
      <h2 id="subscribe-heading" class="subscribe__title">Новинки недели — в вашем почтовом ящике</h2>
      <p class="subscribe__description">Одно письмо по пятницам: три новых книги, рецензия редакции и подборка от сообщества.</p>
    </div>
    <div class="subscribe__form-wrapper">
      <form class="subscribe__form" aria-labelledby="subscribe-heading">
        <label for="subscribe-email" class="visually-hidden">Ваш e-mail</label>
        <input
          type="email"
          id="subscribe-email"
          class="subscribe__input"
          placeholder="Ваш e-mail"
          autocomplete="email"
          required
        />
        <button class="subscribe__button" type="submit">Подписаться</button>
      </form>
        <p class="subscribe__note">
          Отписаться можно в один клик. Мы не передаём адреса третьим лицам.
        </p>
    </div>
  </div>
</section>
