<div class="page">
  <app-header [isMiniLayout]="true"/>
  <main class="main">
    <section class="login">
      <div class="login__content container">
        @if (formMode() === AuthFormType.Login) {
          <app-login-form (clicked)="setFormMode($event)"/>
        } @else {
         <app-registration-form (clicked)="setFormMode($event)"/>
        }
      </div>
    </section>
  </main>
  <app-footer [isMiniLayout]="true"/>
</div>
