<div class="page">
  <app-header [isMiniLayout]="true"/>
  <main class="main">
    <section class="profile">
      <h1 class="visually-hidden">Профиль</h1>
      <div class="profile__content container">
        <div class="profile__info">
          <span>{{ userInfo().username }}</span>
          <span>{{ userInfo().email }}</span>
          <div class="profile__avatar-wrapper">
            <div class="profile__avatar">
              <img [ngSrc]="userInfo().avatarUrl ?? DEFAULT_AVATAR_URL" width="320" height="320"/>
            </div>
          </div>
        </div>
        <div class="profile__edit">
          <div class="profile__avatar-edit-wrapper">
            <label for="profile-avatar-edit" class="profile__avatar-edit-label">
              <img
                class="profile__avatar-edit"
                [ngSrc]="userInfo().avatarUrl ?? DEFAULT_AVATAR_URL"
                width="68"
                height="68"
                alt="Аватар пользователя"
              />
              <span>Изменить аватар</span>
            </label>
            <input
              #avatarInput
              id="profile-avatar-edit"
              class="visually-hidden"
              accept="image/*"
              type="file"
              appSelectFile
              (fileSelected)="onAvatarSelected($event)"
            />
            @if (avatarError()) {
              <div>
                {{ avatarError() }}
              </div>
            }
          </div>
          <form class="profile__form">
            <div class="profile__input-wrapper">
              <mat-form-field appearance="outline">
                <mat-label>Фамилия</mat-label>
                <input type="text" matInput/>
                <mat-icon matSuffix>person</mat-icon>
              </mat-form-field>
            </div>

            <div class="profile__input-wrapper">
              <mat-form-field appearance="outline">
                <mat-label>Имя</mat-label>
                <input type="text" matInput/>
                <mat-icon matSuffix>person</mat-icon>
              </mat-form-field>
            </div>

            <div class="profile__input-wrapper">
              <mat-form-field appearance="outline">
                <mat-label>Дата рождения</mat-label>
                <input
                  id="profile-birthday"
                  matInput [matDatepicker]="picker"
                />
                <mat-datepicker-toggle matIconSuffix [for]="picker"/>
                <mat-datepicker #picker/>
              </mat-form-field>
            </div>
            <div class="profile__input-wrapper profile__input-wrapper--bio">
            <mat-form-field class="profile__my" appearance="outline">
              <mat-label>Расскажите о себе...</mat-label>
              <textarea class=" profile__input profile__bio" matInput ></textarea>
            </mat-form-field>
            </div>
            <button class="profile__button-submit" type="submit">Сохранить изменения</button>
          </form>
        </div>

      </div>
    </section>
  </main>
  <app-footer [isMiniLayout]="true"/>
</div>
