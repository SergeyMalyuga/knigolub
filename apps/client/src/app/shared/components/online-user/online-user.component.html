<div class="online-user__image">
  <img [src]="onlineUser().avatarUrl" width="52" height="52" alt="" />
</div>
<div class="online-user__info">
  <span class="online-user__name">{{ onlineUser().name }}</span>
  <time class="online-user__time" [attr.datetime]="lastSeenAgo()"
    >онлайн: {{ lastSeenAgo() }}
  </time>
</div>
