<header
  [ngClass]="{
    header: true,
    'header--unpinned': isMiniLayout,
  }"
>
  <div class="header__content container">
    <a class="header__link header__link--logo" [routerLink]="[AppRoute.MAIN]">
      <img
        class="header__logo-image"
        src="/assets/images/vector/logo-black.svg"
        width="155"
        height="24"
        alt="Логотип клуба"
      />
    </a>
    <div
      id="header-menu"
      [ngClass]="{
        header__menu: true,
        'header__menu--mini-layout': isMiniLayout,
        'header__menu--open': isMenuOpen(),
      }"
    >
      <nav
        [ngClass]="{
          header__nav: true,
          hidden: isMiniLayout,
        }"
        aria-label="Основная навигация"
      >
        <ul class="header__nav-links" role="menubar">
          <li role="none">
            <a
              role="menuitem"
              [ngClass]="{
                header__link: true,
                'header__link--nav': true,
                active: isActive(Section.MAIN),
              }"
              (click)="selectSection(Section.MAIN)"
              href="#main"
              >Главная</a
            >
          </li>
          <li role="none">
            <a
              role="menuitem"
              [ngClass]="{
                header__link: true,
                'header__link--nav': true,
                active: isActive(Section.CATALOG),
              }"
              (click)="selectSection(Section.CATALOG)"
              href="#catalog"
              >Каталог</a
            >
          </li>
          <li role="none">
            <a
              role="menuitem"
              [ngClass]="{
                header__link: true,
                'header__link--nav': true,
                active: isActive(Section.COLLECTION),
              }"
              (click)="selectSection(Section.COLLECTION)"
              href="#collection"
              >Подборки</a
            >
          </li>
          <li role="none">
            <a
              role="menuitem"
              [ngClass]="{
                header__link: true,
                'header__link--nav': true,
                active: isActive(Section.COMMUNITY),
              }"
              (click)="selectSection(Section.COMMUNITY)"
              href="#community"
              >Сообщество</a
            >
          </li>
          <li role="none">
            <a
              role="menuitem"
              [ngClass]="{
                header__link: true,
                'header__link--nav': true,
                active: isActive(Section.REVIEWS),
              }"
              (click)="selectSection(Section.REVIEWS)"
              href="#reviews"
              >Отзывы</a
            >
          </li>
        </ul>
      </nav>
      <div class="header__actions">
        <div
          role="search"
          [ngClass]="{
            header__search: true,
            hidden: isMiniLayout,
          }"
        >
          <label for="header-search" class="visually-hidden">Поиск: книга, автор, жанр</label>
          <input
            id="header-search"
            class="header__input-search"
            type="search"
            placeholder="{{ isMobile() ? 'Поиск по каталогу' : 'Поиск: книга, автор, жанр' }}"
          />
        </div>
        @if (authStatus() !== AuthStatus.AUTH) {
          <a
            class="header__link header__link--action"
            [ngClass]="{
              hidden: isMiniLayout,
            }"
            [routerLink]="['/', AppRoute.LOGIN]"
            >{{ isMobile() ? 'Войти' : 'Присоединиться' }}</a
          >
        } @else if (authStatus() === AuthStatus.AUTH) {
          <a
            class="header__link header__link--favorite header__interactive"
            [attr.aria-label]="`Избранных книг ${favoriteBooksTotal()}`"
            [routerLink]="['/', AppRoute.FAVORITES]"
          >
            <svg class="header__icon" width="24" height="24" viewBox="0 0 32 32" aria-hidden="true">
              <use href="/assets/images/vector/heart.svg#heart"></use>
            </svg>
            <span aria-hidden="true">{{ favoriteBooksTotal() }}</span>
          </a>
          <a
            class="header__link header__link--profile header__interactive"
            [attr.aria-label]="`Перейти в профиль пользователя ${userName()}`"
            [routerLink]="['/', AppRoute.PROFILE]"
          >
            <div class="header__avatar">
              <img
                class="header__icon"
                [ngSrc]="userAvatar() ?? DEFAULT_AVATAR_URL"
                width="24"
                height="24"
                alt=""
              />
            </div>
            <span aria-hidden="true">{{ userName() }}</span>
          </a>
          <button
            class="header__button-logout header__interactive"
            (click)="logout()"
            aria-label="Выйти из аккаунта"
            type="button"
          ></button>
        }
      </div>
    </div>
    <button
      [ngClass]="{
        header__burger: true,
        'header__burger--close': isMenuOpen(),
        hidden: isMiniLayout,
      }"
      type="button"
      aria-haspopup="true"
      [attr.aria-label]="isMenuOpen() ? 'Закрыть меню' : 'Открыть меню'"
      [aria-expanded]="isMenuOpen()"
      aria-controls="header-menu"
      (click)="toggleMenu()"
    >
      <span></span>
    </button>
  </div>
</header>
