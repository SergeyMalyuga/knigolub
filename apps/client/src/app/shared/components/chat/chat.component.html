<aside class="chat" cdkDrag appChatDragConstraint appCloseOnEscape (closed)="closeChat()">
  <header class="chat__header" cdkDragHandle>
    <h2>Общий чат</h2>
    <button class="chat__close" type="button" (click)="closeChat()" matIconButton>
      <mat-icon>close</mat-icon>
    </button>
  </header>
  <div class="chat__content">
    <div class="chat__sidebar">
      <div class="chat__user-info">
        <div class="chat__avatar">
          <img [src]=user().avatarUrl width="100" height="100" alt="Аватар {{user().username}}" loading="lazy">
        </div>
        <span>{{ user().username }}</span>

        <mat-form-field class="chat__status chat__status--online" appearance="outline">
          <mat-label>Статус</mat-label>
          <mat-select [value]=CHAT_STATUS_CONFIG.OFFLINE.value>
            <mat-option value="{{CHAT_STATUS_CONFIG.OFFLINE.value}}">
              {{ CHAT_STATUS_CONFIG.OFFLINE.label }}
            </mat-option>
            <mat-option value="{{CHAT_STATUS_CONFIG.ONLINE.value}}">
              {{ CHAT_STATUS_CONFIG.ONLINE.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>

      </div>
    </div>
    <div class="chat__main"></div>
  </div>
</aside>
